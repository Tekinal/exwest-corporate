<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Exwest forms</title></head>
  <body>
    <form name="exwest-commercial-inquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="exwest-commercial-inquiry">
      <input name="bot-field">
      <input name="fullName">
      <input name="company">
      <input name="email" type="email">
      <input name="phone">
      <select name="interest"><option>CIE Marketplace</option></select>
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="yes">
    </form>
  </body>
</html>
